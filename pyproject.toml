[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-ai"
version = "0.1.0"
description = "Fully local AI engine that detects cash-desk discipline violations on video (ForteBank case, Datathon 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "forte_ai team" }]
dependencies = [
    "numpy>=1.26,<2.3",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "av>=13",
    "imageio-ffmpeg>=0.5",
    "pandas>=2.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "jsonschema>=4.20",
    "pydantic>=2.5",
    "requests>=2.31",
    "supervision>=0.25",
    "rtmlib>=0.0.13",
    "onnxruntime-gpu>=1.19",
    "torch>=2.6,<2.7",
    "torchvision>=0.21,<0.22",
    "transformers>=4.57,<4.58",
    "accelerate>=1.0",
    "timm>=1.0",
    "qwen-vl-utils>=0.0.11",
    "bitsandbytes>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-docx>=1.1",
    "ruff>=0.6",
]

[project.scripts]
forte-ai = "forte_ai.cli:main"

[tool.setuptools.packages.find]
include = ["forte_ai*", "server*"]

[tool.setuptools.package-data]
forte_ai = ["kb/*.json", "kb/laws/*.json", "vlm/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
