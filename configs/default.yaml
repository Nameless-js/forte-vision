# forte_ai default configuration. ALL thresholds live here (never in code).
# Profile overlays (configs/profile-*.yaml) override keys; `profile: auto` picks one from the hardware.
engine_version: "0.1.0"
profile: auto            # auto | gpu-large | gpu-small | cpu
seed: 42
device: auto             # auto | cuda | cpu

video:
  sample_fps: 5.0        # perception sampling rate (3.0 on cpu profile)
  max_side: 960          # frames are resized so that max(h, w) <= max_side before detection
  evidence_max_width: 1280
  evidence_jpeg_quality: 85

perception:
  detector:
    backend: grounding_dino            # grounding_dino | owlv2 | rtdetr
    model_id: IDEA-Research/grounding-dino-tiny
    # open-vocabulary prompts per engine class (lower-case, '.'-joined into one text query)
    # phrases chosen with scripts/prompt_probe.py on this scene (see analysis/perception_qa.md)
    prompts:
      person: ["person"]
      cash: ["banknotes", "money", "paper bills"]
      bag: ["money bag", "sack", "handbag"]
      document: ["document"]
      id_card: ["small card", "plastic card", "id card"]
      phone: ["mobile phone", "cell phone", "smartphone"]
      storage: ["metal cabinet", "grey metal box", "locker"]          # safe / cabinet / drawer unit
      counting_machine: ["black printer", "black office machine", "money counting machine"]
      laptop: ["laptop"]
      cup: ["paper coffee cup", "drink bottle", "food package"]       # personal items / eating at the desk
    landmark_classes: ["counting_machine", "storage", "laptop"]       # static objects; small objects inside them are suppressed
    input_short_side: 480              # detector input: shortest side in px (0 = processor default 800)
    box_threshold: 0.30
    text_threshold: 0.25
    class_thresholds:                  # per-class overrides of box_threshold
      person: 0.35
      cash: 0.25
      bag: 0.40
      document: 0.40
      id_card: 0.35
      phone: 0.35
      storage: 0.35
      counting_machine: 0.40
      laptop: 0.30
      cup: 0.35
    cross_class_iou: 0.50              # overlapping boxes of different classes: keep the higher score
    class_max_area_frac:               # hand-held objects cannot be large (fraction of the frame area)
      cash: 0.03
      document: 0.04
      id_card: 0.01
      phone: 0.01
      bag: 0.12
      cup: 0.015
    detect_every_n: 1                  # run the detector on every n-th sampled frame
    min_box_area_frac: 0.0003
    max_boxes_per_class: 8
    batch_size: 2
    fp16: true
  tracker:
    backend: bytetrack                 # supervision.ByteTrack (MIT)
    track_activation_threshold: 0.30
    lost_track_buffer: 25              # frames (at sample_fps)
    minimum_matching_threshold: 0.80
    minimum_consecutive_frames: 2
  pose:
    backend: rtmlib                    # rtmlib | none
    mode: lightweight                  # rtmlib Wholebody/Body mode: performance | lightweight | balanced
    model: body                        # body (17 kp) | wholebody (133 kp)
    every_n: 1
    kpt_threshold: 0.30

roles:
  calibration_seconds: 12.0            # initial window used to find the cashier; keeps updating afterwards
  cashier_min_presence: 0.50           # share of sampled frames the cashier track must be present in
  cashier_zone_dilate_frac: 0.12       # dilation of the cashier hull, fraction of frame diagonal
  counter_margin_frac: 0.04            # band around the counter line that counts as "at the window"
  client_max_dist_frac: 0.40           # a track is a window candidate only if it comes within this fraction of the frame diagonal of the cashier
  client_band_frac: 0.15               # ... and within this fraction of the diagonal of the counter line (people behind glass walls stay "other")
  client_sit_radius_frac: 0.05         # a window candidate must hold a position within this radius (seated at the desk)
  zone_min_radius_frac: 0.08           # lower bound of the cashier-zone radius
  reach_frac: 0.10                     # arm extension toward the other side of the counter that counts as a reach (fraction of the diagonal)
  collector_bag_iou: 0.05
  min_track_frames: 5

rules:
  counting_window_s: 15.0              # look-back window for a counting segment before a handover
  counting_min_duration_s: 1.5         # minimum duration of periodic hand motion over cash
  counting_min_cycles: 3
  counting_hand_speed_px_s: 40.0
  unattended_cash_s: 4.0               # cash visible with no cashier hand nearby for this long
  unattended_min_cash_score: 0.35
  left_zone_min_s: 1.5                 # cashier outside own zone for this long while a client is present
  service_established_s: 2.0           # cashier must have been in the zone this long before "left" can fire
  phone_min_s: 2.0
  phone_min_score: 0.45
  phone_radius_frac: 0.045
  intrusion_min_s: 2.5
  handover_max_gap_s: 1.0              # cash near hand A then hand B within this gap = handover
  id_check_window_s: 20.0
  bag_check_window_s: 15.0
  two_clients_min_s: 4.0
  merge_events_within_s: 3.0           # candidates of one type closer than this are merged
  max_violations_per_video: 6
  # departures / empty workplace
  empty_room_after_s: 6.0              # room must stay empty this long after the cashier walks out (or till video end)
  securing_min_s: 5.0                  # cumulative hands-at-safe time before departure that counts as "secured"
  securing_lookback_s: 18.0
  storage_dwell_radius_frac: 0.09      # wrist within this radius of the storage centre counts as safe interaction
  empty_start_s: 2.5                   # workplace empty this long at video start -> entry mode
  workplace_near_frac: 0.10           # body within this radius of a workplace anchor counts as "at the workplace"
  entry_min_s: 1.5
  # personal items
  cup_min_s: 2.0
  # counting (reworked)
  counting_machine_min_s: 1.2
  counting_cash_fraction: 0.25         # share of periodic-motion window frames with cash near the cashier's hands

vlm:
  enabled: true
  mode: choice                         # choice (contrastive A/B logit scoring) | json (generative checklist)
  choice_weight: 0.35                  # confidence moves by choice_weight·(2·p_violation − 1)
  describe: true                       # generate a neutral Russian description for reported violations
  describe_max_new_tokens: 90
  model_id: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16                      # bfloat16 | float16
  load_in_4bit: false
  frames_per_query: 6
  window_half_s: 4.0
  max_pixels: 360000                   # per-frame visual token budget (~600x600)
  max_new_tokens: 220
  temperature: 0.0
  verify_candidates: true
  reject_below_confidence: 0.35        # a candidate the VLM contradicts with confidence >= this is dropped
  catch_all:
    enabled: true
    window_s: 10.0
    stride_s: 10.0
    min_repeats: 2                     # hit must repeat on two adjacent windows
    max_windows: 16
    confidence: 0.55

verdict:
  threshold: 0.50                      # calibrated by scripts/calibrate.py (LOVO)
  per_type_thresholds: {}
  evidence_frames: 3                   # 1..3 (clean frame at t, annotated at t, clean at t+1 s)

time:
  deadline_s: 240
  vlm_cutoff_s: 200
  hard_limit_s: 300
  progress_stage_weights:              # for on_progress fractions
    decode: 0.05
    detect: 0.45
    track_pose: 0.15
    roles: 0.05
    rules: 0.05
    vlm: 0.20
    report: 0.05

cache:
  enabled: true
  dir: data/cache
  pipeline_version: "p4"               # bump to invalidate perception caches
