# NVIDIA 6-12 GB (RTX 4060 Laptop 8 GB is the development machine)
profile: gpu-small
device: cuda
video:
  sample_fps: 5.0
  max_side: 960
perception:
  detector:
    model_id: IDEA-Research/grounding-dino-tiny
    batch_size: 2
    fp16: true
  pose:
    mode: lightweight
vlm:
  enabled: true
  model_id: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16
  load_in_4bit: false
  frames_per_query: 6
  catch_all:
    max_windows: 12
