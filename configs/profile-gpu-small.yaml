# NVIDIA 6-12 GB (RTX 4060 Laptop 8 GB is the development machine)
profile: gpu-small
device: cuda
video:
  sample_fps: 5.0
  max_side: 960
perception:
  detector:
    model_id: IDEA-Research/grounding-dino-tiny
    batch_size: 2
    fp16: true
  pose:
    mode: lightweight
vlm:
  enabled: true
  # measured (reports/iter_014 vs iter_015, choice mode): 4B-NF4 AUC 0.67 vs 2B-bf16 0.59 on rule candidates,
  # departures 0.77 vs 0.63; 4B-NF4 peak VRAM ~4.5 GB with the vision tower kept in bf16
  model_id: Qwen/Qwen3-VL-4B-Instruct
  dtype: bfloat16
  load_in_4bit: true
  quant_skip_modules: ["visual", "lm_head"]
  min_free_vram_gb: 4.0
  frames_per_query: 6
  catch_all:
    max_windows: 12
